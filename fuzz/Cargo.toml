[package]
name = "dz6-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rand = "0.10.1"
arboard = { version = "3", default-features = false }
chrono = "0.4.45"
clap = { version = "4.5.49", features = ["derive"] }
crossterm = "0.29.0"
directories-next = "2.0.0"
encoding_rs = "0.8.35"
evalexpr = "13.1.*"
goblin = "0.10.5"
hex = "0.4.3"
memchr = "2.8.0"
mmap-io = "1.0.0"
ratatui = "0.30.0"
regex = "1.11.2"
serde = { version = "1.0.228", features = ["derive"] }
shell-words = "1.1.0"
toml = "1.0.1"
tui-input = "0.15.0"

[[bin]]
name = "app_load_file"
path = "fuzz_targets/app_load_file.rs"

[[bin]]
name = "commands_parse_command"
path = "fuzz_targets/commands_parse_command.rs"

[workspace]
